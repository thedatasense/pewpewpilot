[package]
name = "durlar-server"
version = "1.0.0"
edition = "2024"
description = "High-performance Rust backend API for the PewPewPilot DurLAR LiDAR & camera viewer"

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "coreml"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
